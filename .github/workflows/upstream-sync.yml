name: Sync official S-UI sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: drnetwork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout standalone project
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Import official backend and frontend changes
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The frontend is ordinary source code in this repository. Preserve it
          # while merging the official backend, whose repository uses a gitlink
          # at the same path.
          tar -czf /tmp/drnetwork-frontend.tgz -C frontend .
          git remote add upstream-backend https://github.com/alireza0/s-ui.git 2>/dev/null || true
          git fetch upstream-backend main
          if ! git merge-base --is-ancestor upstream-backend/main HEAD; then
            set +e
            git merge --no-commit --no-ff upstream-backend/main
            merge_rc=$?
            set -e

            git rm -rf --cached frontend >/dev/null 2>&1 || true
            rm -rf frontend
            mkdir frontend
            tar -xzf /tmp/drnetwork-frontend.tgz -C frontend
            rm -f .gitmodules
            git add -A -- frontend .gitmodules

            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ -n "$conflicts" ]]; then
              echo "Unresolved backend conflicts:" >&2
              echo "$conflicts" >&2
              exit 1
            fi
            if [[ $merge_rc -ne 0 ]]; then
              echo "The frontend type conflict was resolved automatically."
            fi
          fi

          # Apply official frontend changes inside the vendored frontend tree.
          git remote add upstream-frontend https://github.com/alireza0/s-ui-frontend.git 2>/dev/null || true
          git fetch upstream-frontend main
          frontend_base=$(cat .upstream/frontend.commit)
          frontend_target=$(git rev-parse upstream-frontend/main)
          if [[ "$frontend_base" != "$frontend_target" ]]; then
            if ! git diff --binary "$frontend_base" "$frontend_target" | git apply --3way --directory=frontend -; then
              echo "Official frontend changes conflict with DrNetwork customizations." >&2
              exit 1
            fi
            printf '%s\n' "$frontend_target" > .upstream/frontend.commit
          fi

          # Official files import their original module. Normalize every sync so
          # the standalone project keeps its own module identity.
          find . -path './frontend' -prune -o -name '*.go' -type f -print0 | \
            xargs -0 sed -i 's#github.com/alireza0/s-ui#github.com/Danialrostamani/drnetwork-panel#g'
          sed -i 's#^module github.com/alireza0/s-ui$#module github.com/Danialrostamani/drnetwork-panel#' go.mod
          git add -A

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Validate backend
        if: steps.sync.outputs.changed == 'true'
        run: |
          unformatted=$(gofmt -l . | grep -v '^frontend/' || true)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
          . ./build-tags.sh
          TAGS=$(tags_for test)
          go vet -tags "$TAGS" ./...
          go test -tags "$TAGS" ./...

      - name: Setup Node.js
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        if: steps.sync.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint -- --max-warnings=0
          npx vue-tsc --noEmit
          npm test
          npm run build

      - name: Commit and push validated update
        if: steps.sync.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git commit -m 'chore: sync official S-UI sources'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
